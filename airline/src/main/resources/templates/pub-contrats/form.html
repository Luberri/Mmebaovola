<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contrat Publicitaire - Formulaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4" th:text="${contrat.id != null} ? 'Modifier Contrat' : 'Nouveau Contrat'"></h1>
    
    <form th:action="@{/pub-contrats}" th:object="${contrat}" method="post">
        <input type="hidden" th:field="*{id}">
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="societe" class="form-label">Société</label>
                <select class="form-select" id="societe" th:field="*{societe.id}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="s : ${societes}" th:value="${s.id}" th:text="${s.nom}"></option>
                </select>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="configurationPrix" class="form-label">Configuration Prix</label>
                <select class="form-select" id="configurationPrix" th:field="*{configurationPrix.id}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="config : ${configurations}" th:value="${config.id}" 
                            th:text="${#numbers.formatDecimal(config.prix, 0, 2) + ' Ar'}"></option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-4 mb-3">
                <label for="dateDebut" class="form-label">Date Début</label>
                <input type="date" class="form-control" id="dateDebut" th:field="*{dateDebut}" required>
            </div>
            
            <div class="col-md-4 mb-3">
                <label for="dateFin" class="form-label">Date Fin</label>
                <input type="date" class="form-control" id="dateFin" th:field="*{dateFin}" required>
            </div>
            
            <div class="col-md-4 mb-3">
                <label for="nbrDiffusion" class="form-label">Nombre de Diffusions</label>
                <input type="number" class="form-control" id="nbrDiffusion" th:field="*{nbrDiffusion}" required min="1">
            </div>
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" th:field="*{description}" rows="3"></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/pub-contrats}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
