<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurations Prix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4"><i class="bi bi-currency-exchange"></i> Configurations de Prix</h1>
    
    <a th:href="@{/configurations-prix/new}" class="btn btn-primary mb-3">
        <i class="bi bi-plus"></i> Nouvelle Configuration
    </a>
    
    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Prix (Ar)</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="config : ${configurations}">
                <td th:text="${config.id}"></td>
                <td th:text="${#numbers.formatDecimal(config.prix, 0, 2)} + ' Ar'"></td>
                <td>
                    <a th:href="@{/configurations-prix/edit/{id}(id=${config.id})}" 
                       class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i> Modifier
                    </a>
                    <a th:href="@{/configurations-prix/delete/{id}(id=${config.id})}" 
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette configuration ?')">
                        <i class="bi bi-trash"></i> Supprimer
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(configurations)}">
                <td colspan="3" class="text-center">Aucune configuration trouvée</td>
            </tr>
        </tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
