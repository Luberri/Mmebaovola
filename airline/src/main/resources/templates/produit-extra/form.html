<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${produitExtra.id != null} ? 'Modifier Produit Extra' : 'Nouveau Produit Extra'">Produit Extra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-box-seam"></i>
                        <span th:text="${produitExtra.id != null} ? 'Modifier Produit Extra' : 'Nouveau Produit Extra'"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <form th:action="${produitExtra.id != null} ? @{/produits-extra/edit/{id}(id=${produitExtra.id})} : @{/produits-extra/create}" 
                          th:object="${produitExtra}" method="post">
                        
                        <div class="mb-3">
                            <label for="produit" class="form-label">Nom du Produit</label>
                            <input type="text" class="form-control" id="produit" 
                                   th:field="*{produit}" required>
                        </div>

                        <div class="mb-3">
                            <label for="prix" class="form-label">Prix (Ar)</label>
                            <input type="number" step="0.01" class="form-control" id="prix" 
                                   th:field="*{prix}" required>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Enregistrer
                            </button>
                            <a th:href="@{/produits-extra}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Retour
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
