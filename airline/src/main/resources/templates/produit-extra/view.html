<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail Produit Extra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-box-seam"></i> Détail du Produit Extra
                    </h4>
                </div>
                <div class="card-body">
                    <table class="table table-borderless">
                        <tr>
                            <th>ID:</th>
                            <td th:text="${produitExtra.id}"></td>
                        </tr>
                        <tr>
                            <th>Produit:</th>
                            <td th:text="${produitExtra.produit}"></td>
                        </tr>
                        <tr>
                            <th>Prix:</th>
                            <td th:text="${#numbers.formatDecimal(produitExtra.prix, 0, 'COMMA', 2, 'POINT')} + ' Ar'"></td>
                        </tr>
                    </table>

                    <div class="d-flex gap-2 mt-3">
                        <a th:href="@{/produits-extra/edit/{id}(id=${produitExtra.id})}" 
                           class="btn btn-warning">
                            <i class="bi bi-pencil"></i> Modifier
                        </a>
                        <a th:href="@{/produits-extra}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Retour
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
