<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - Formulaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4" th:text="${reservation.id != null} ? 'Modifier Réservation' : 'Nouvelle Réservation'"></h1>
    
    <!-- Affichage de l'erreur si siège déjà réservé -->
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    
    <form th:action="@{/reservations}" th:object="${reservation}" method="post">
        <input type="hidden" th:field="*{id}">
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="passager" class="form-label">Passager</label>
                <select class="form-select" id="passager" th:field="*{passager.id}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="p : ${passagers}" th:value="${p.id}" 
                            th:text="${p.nom + ' ' + p.prenom}"></option>
                </select>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="statut" class="form-label">Statut</label>
                <select class="form-select" id="statut" th:field="*{statut}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="s : ${T(com.example.airline.model.enums.StatutReservation).values()}"
                            th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="numSieges" class="form-label">Numéros de Sièges (séparés par des virgules)</label>
                <input type="text" class="form-control" id="numSieges" name="numSieges" th:value="${numSieges}" required>
            </div>
            <div class="col-md-2 mb-3">
                <label for="nombreSieges" class="form-label">Nombre de Sièges</label>
                <input type="number" class="form-control" id="nombreSieges" min="1" placeholder="Entrez un nombre">
            </div>
            <div class="col-md-6 mb-3">
                <label for="dateReservation" class="form-label">Date de réservation</label>
                <input type="datetime-local" class="form-control" id="dateReservation" th:field="*{dateReservation}" required>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="vol" class="form-label">Vol</label>
                <select class="form-select" id="vol" th:field="*{vol.id}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="v : ${vols}" th:value="${v.id}" th:text="${v.numeroVol}"></option>
                </select>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="classe" class="form-label">Classe</label>
                <select class="form-select" id="classe" th:field="*{classe.id}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.libelle}"></option>
                </select>
            </div>
        </div>
        
        
        <div class="mb-3">
            <label for="tarif" class="form-label">Tarif (Vol / Classe / Type)</label>
            <select class="form-select" id="tarif" th:field="*{tarifVolClasseType.id}" required>
                <option value="">-- Sélectionner --</option>
                <option th:each="t : ${tarifs}" th:value="${t.id}"
                        th:text="${t.vol.numeroVol + ' / ' + t.classe.libelle + ' / ' + t.type + ' - ' + #numbers.formatDecimal(t.prix, 0, 2) + ' Ar'}"></option>
            </select>
        </div>
        
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/reservations}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('nombreSieges').addEventListener('input', function() {
        const nombre = parseInt(this.value, 10);
        const numSiegesInput = document.getElementById('numSieges');

        if (!isNaN(nombre) && nombre > 0) {
            const sieges = Array.from({ length: nombre }, (_, i) => i + 1).join(',');
            numSiegesInput.value = sieges;
        } else {
            numSiegesInput.value = '';
        }
    });
</script>
</body>
</html>
