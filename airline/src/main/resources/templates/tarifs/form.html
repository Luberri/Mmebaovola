<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarif - Formulaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4" th:text="${tarif.id != null} ? 'Modifier Tarif' : 'Nouveau Tarif'"></h1>
    
    <form th:action="@{/tarifs}" th:object="${tarif}" method="post">
        <input type="hidden" th:field="*{id}">
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="vol" class="form-label">Vol</label>
                <select class="form-select" id="vol" th:field="*{vol.id}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="v : ${vols}" th:value="${v.id}" 
                            th:text="${v.numeroVol + ' (' + (v.avion != null ? v.avion.modele : 'N/A') + ')'}"></option>
                </select>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="classe" class="form-label">Classe</label>
                <select class="form-select" id="classe" th:field="*{classe.id}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="c : ${classes}" th:value="${c.id}" th:text="${c.libelle}"></option>
                </select>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="type" class="form-label">Type de tarif</label>
                <input class="form-control" id="type" th:field="*{type}" required>
            </div>
        </div>
        
        <!-- Choix du mode de calcul -->
        <div class="card mb-3">
            <div class="card-header">
                <strong>Mode de calcul du prix</strong>
            </div>
            <div class="card-body">
                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="modeCalcul" id="modeDirect" 
                           value="direct" checked onclick="toggleMode('direct')">
                    <label class="form-check-label" for="modeDirect">
                        Saisir le prix directement
                    </label>
                </div>
                
                <div class="form-check mb-3">
                    <input class="form-check-input" type="radio" name="modeCalcul" id="modePourcentage" 
                           value="pourcentage" onclick="toggleMode('pourcentage')"
                           th:checked="${tarif.tarifReference != null}">
                    <label class="form-check-label" for="modePourcentage">
                        Calculer à partir d'un pourcentage d'un autre tarif
                    </label>
                </div>
                
                <!-- Prix direct -->
                <div id="prixDirectSection" class="row">
                    <div class="col-md-6 mb-3">
                        <label for="prix" class="form-label">Prix (Ar)</label>
                        <input type="number" step="1000" class="form-control" id="prix" th:field="*{prix}">
                    </div>
                </div>
                
                <!-- Pourcentage -->
                <div id="pourcentageSection" class="row" style="display: none;">
                    <div class="col-md-6 mb-3">
                        <label for="tarifReferenceId" class="form-label">Tarif de référence</label>
                        <select class="form-select" id="tarifReferenceId" name="tarifReferenceId">
                            <option value="">-- Sélectionner un tarif --</option>
                            <option th:each="t : ${tarifsReference}" 
                                    th:value="${t.id}" 
                                    th:text="${t.vol.numeroVol + ' / ' + t.classe.libelle + ' / ' + t.type + ' - ' + #numbers.formatDecimal(t.prix, 0, 2) + ' Ar'}"
                                    th:selected="${tarif.tarifReference != null and tarif.tarifReference.id == t.id}"></option>
                        </select>
                    </div>
                    
                    <div class="col-md-6 mb-3">
                        <label for="pourcentage" class="form-label">Pourcentage (%)</label>
                        <input type="number" step="0.01" class="form-control" id="pourcentage" 
                               th:field="*{pourcentage}" placeholder="Ex: 80 pour 80%">
                        <small class="text-muted">Ex: 80 = 80% du prix de référence, 120 = 120% (majoration)</small>
                    </div>
                </div>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/tarifs}" class="btn btn-secondary">Annuler</a>
    </form>
</div>

<script>
    function toggleMode(mode) {
        const prixSection = document.getElementById('prixDirectSection');
        const pourcentageSection = document.getElementById('pourcentageSection');
        const prixInput = document.getElementById('prix');
        
        if (mode === 'direct') {
            prixSection.style.display = 'flex';
            pourcentageSection.style.display = 'none';
            prixInput.required = true;
        } else {
            prixSection.style.display = 'none';
            pourcentageSection.style.display = 'flex';
            prixInput.required = false;
        }
    }
    
    // Initialisation au chargement
    document.addEventListener('DOMContentLoaded', function() {
        const tarifReference = document.getElementById('tarifReferenceId').value;
        if (tarifReference) {
            document.getElementById('modePourcentage').checked = true;
            toggleMode('pourcentage');
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
