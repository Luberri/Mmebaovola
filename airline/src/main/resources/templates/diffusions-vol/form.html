<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diffusion Vol - Formulaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4" th:text="${diffusion.id != null} ? 'Modifier Diffusion' : 'Nouvelle Diffusion'"></h1>
    
    <form th:action="@{/diffusions-vol}" th:object="${diffusion}" method="post">
        <input type="hidden" th:field="*{id}">
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="pubContrat" class="form-label">Contrat Publicitaire</label>
                <select class="form-select" id="pubContrat" th:field="*{pubContrat.id}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="contrat : ${contrats}" th:value="${contrat.id}" 
                            th:text="${contrat.societe?.nom + ' - ' + contrat.description}"></option>
                </select>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="vol" class="form-label">Vol</label>
                <select class="form-select" id="vol" th:field="*{vol.id}" required>
                    <option value="">-- Sélectionner --</option>
                    <option th:each="v : ${vols}" th:value="${v.id}" th:text="${v.numeroVol}"></option>
                </select>
            </div>
        </div>
        
        <div class="mb-3">
            <label for="nbrDiffusion" class="form-label">Nombre de Diffusions</label>
            <input type="number" class="form-control" id="nbrDiffusion" th:field="*{nbrDiffusion}" required min="1">
        </div>
        
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/diffusions-vol}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
