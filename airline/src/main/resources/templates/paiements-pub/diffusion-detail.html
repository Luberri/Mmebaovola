<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détail Paiements - Diffusion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4"><i class="bi bi-receipt"></i> Détail des Paiements</h1>
    
    <!-- Informations de la diffusion -->
    <div class="card mb-4">
        <div class="card-header bg-primary text-white">
            <i class="bi bi-broadcast"></i> Diffusion #<span th:text="${diffusion.id}"></span>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <p><strong>Société :</strong> <span th:text="${diffusion.pubContrat?.societe?.nom}"></span></p>
                    <p><strong>Contrat :</strong> <span th:text="${diffusion.pubContrat?.description}"></span></p>
                    <p><strong>Vol :</strong> <span th:text="${diffusion.vol?.numeroVol}"></span></p>
                    <p><strong>Nombre de diffusions :</strong> <span th:text="${diffusion.nbrDiffusion}"></span></p>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-body">
                            <h5>Récapitulatif</h5>
                            <table class="table table-sm">
                                <tr>
                                    <td>Montant Total :</td>
                                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(montantTotal, 0, 2) + ' Ar'}"></td>
                                </tr>
                                <tr class="text-success">
                                    <td>Total Payé :</td>
                                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(totalPaye, 0, 2) + ' Ar'}"></td>
                                </tr>
                                <tr class="text-danger">
                                    <td>Reste à Payer :</td>
                                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(resteAPayer, 0, 2) + ' Ar'}"></td>
                                </tr>
                            </table>
                            
                            <!-- Barre de progression -->
                            <div class="progress" style="height: 25px;">
                                <div class="progress-bar bg-success" role="progressbar" 
                                     th:style="${'width: ' + (montantTotal > 0 ? (totalPaye * 100 / montantTotal) : 0) + '%'}"
                                     th:text="${montantTotal > 0 ? #numbers.formatDecimal(totalPaye * 100 / montantTotal, 0, 0) + '%' : '0%'}">
                                </div>
                            </div>
                            
                            <div th:if="${isPaiementComplet}" class="alert alert-success mt-3 mb-0">
                                <i class="bi bi-check-circle-fill"></i> Paiement complet !
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Bouton pour ajouter un paiement -->
    <div th:if="${!isPaiementComplet}" class="mb-3">
        <a th:href="@{/paiements-pub/new(diffusionId=${diffusion.id})}" class="btn btn-success">
            <i class="bi bi-plus"></i> Ajouter un Paiement
        </a>
    </div>
    
    <!-- Historique des paiements -->
    <h3><i class="bi bi-clock-history"></i> Historique des Paiements</h3>
    <table class="table table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Montant</th>
                <th>Date</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="paiement : ${paiements}">
                <td th:text="${paiement.id}"></td>
                <td>
                    <span class="badge bg-success" th:text="${#numbers.formatDecimal(paiement.montant, 0, 2) + ' Ar'}"></span>
                </td>
                <td th:text="${#temporals.format(paiement.datePaiement, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${paiement.description ?: '-'}"></td>
                <td>
                    <a th:href="@{/paiements-pub/edit/{id}(id=${paiement.id})}" class="btn btn-sm btn-warning">
                        <i class="bi bi-pencil"></i>
                    </a>
                    <a th:href="@{/paiements-pub/delete/{id}(id=${paiement.id})}" 
                       class="btn btn-sm btn-danger"
                       onclick="return confirm('Êtes-vous sûr ?')">
                        <i class="bi bi-trash"></i>
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(paiements)}">
                <td colspan="5" class="text-center text-muted">Aucun paiement enregistré</td>
            </tr>
        </tbody>
    </table>
    
    <a th:href="@{/paiements-pub}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Retour à la liste
    </a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
