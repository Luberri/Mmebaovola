<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Publicitaire - Formulaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4" th:text="${paiement.id != null} ? 'Modifier Paiement' : 'Nouveau Paiement'"></h1>
    
    <!-- Message d'erreur -->
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
    </div>
    
    <!-- Affichage du reste à payer -->
    <div th:if="${resteAPayer != null}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> Reste à payer : 
        <strong th:text="${#numbers.formatDecimal(resteAPayer, 0, 2) + ' Ar'}"></strong>
    </div>
    
    <form th:action="@{/paiements-pub}" th:object="${paiement}" method="post">
        <input type="hidden" th:field="*{id}">
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="diffusionVol" class="form-label">Diffusion</label>
                <select class="form-select" id="diffusionVol" th:field="*{diffusionVol.id}" required>
                    <option value="">-- Sélectionner une diffusion --</option>
                    <option th:each="d : ${diffusions}" 
                            th:value="${d.id}" 
                            th:text="${d.pubContrat?.societe?.nom + ' - Vol: ' + d.vol?.numeroVol + ' (' + d.nbrDiffusion + ' diffusions)'}"></option>
                </select>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="montant" class="form-label">Montant (Ar)</label>
                <input type="number" step="0.01" class="form-control" id="montant" 
                       th:field="*{montant}" required min="0.01"
                       th:max="${resteAPayer}">
                <small class="text-muted" th:if="${resteAPayer != null}">
                    Maximum : <span th:text="${#numbers.formatDecimal(resteAPayer, 0, 2)}"></span> Ar
                </small>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="datePaiement" class="form-label">Date de Paiement</label>
                <input type="datetime-local" class="form-control" id="datePaiement" 
                       th:field="*{datePaiement}" required>
            </div>
            
            <div class="col-md-6 mb-3">
                <label for="description" class="form-label">Description</label>
                <input type="text" class="form-control" id="description" 
                       th:field="*{description}" placeholder="Ex: Paiement partiel, Acompte...">
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Enregistrer
        </button>
        <a th:href="@{/paiements-pub}" class="btn btn-secondary">
            <i class="bi bi-x-circle"></i> Annuler
        </a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
