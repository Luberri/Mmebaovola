<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Société - Formulaire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4" th:text="${societe.id != null} ? 'Modifier Société' : 'Nouvelle Société'"></h1>
    
    <form th:action="@{/societes}" th:object="${societe}" method="post">
        <input type="hidden" th:field="*{id}">
        
        <div class="mb-3">
            <label for="nom" class="form-label">Nom de la société</label>
            <input type="text" class="form-control" id="nom" th:field="*{nom}" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a th:href="@{/societes}" class="btn btn-secondary">Annuler</a>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
